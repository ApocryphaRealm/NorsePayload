; NorsePayload settings. Timing tables go in the payloads folder (see payloads\README.txt).
[General]
; log detail: 0 trace, 1 debug, 2 info (the default), 3 warn, 4 error, 6 off - set 0 for a bug report
uLogLevel=2
; log every montage that starts (its name and animation) - how names for the tables are found
bLogMontageStarts=0
; where NorsePayload.log is written; empty = this folder
sLogDir=
